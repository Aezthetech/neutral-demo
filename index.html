<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- AGE GATE: shown first. "No" denies entry. -->
  <div class="gate" id="gate">
    <div class="box" id="gateBox">
      <h2>Are you 18 or older?</h2>
      <p>This website sells to adults only.</p>
      <button class="btn" id="yes">Yes, I’m 18 or older</button>
      <button class="ghost" id="no">No, I’m under 18</button>
    </div>
  </div>

  <!-- THE SHOP -->
  <div id="app" hidden>
    <div class="wrap">
      <header>
        <a class="logo" href="index.html" data-shop-name>Shop</a>
        <nav>
          <a class="navlink" href="inventory.html">Inventory</a>
          <button class="cartbtn" id="cartBtn">Cart (<span id="cc">0</span>)</button>
        </nav>
      </header>

      <section class="hero">
        <h1 data-shop-name>Shop</h1>
        <p data-tagline></p>
        <div class="facts"><span class="chip">18+ only</span><span class="chip">Lipa na M-Pesa</span><span class="chip">Live stock counts</span></div>
      </section>

      <div class="filters" id="filters"></div>
      <div class="grid" id="grid"></div>

      <footer>Demo storefront. Products and prices are sample data. No real payments are made. Sale to persons under 18 is prohibited.</footer>
    </div>
  </div>

  <!-- CART -->
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-label="Cart">
    <div class="dhead"><h2>Your cart</h2><button class="ghost" id="closeCart">Close</button></div>
    <div id="items"></div>
    <label class="lbl" for="phone">M-Pesa number</label>
    <input type="tel" id="phone" placeholder="0712 345 678" inputmode="tel">
    <div class="err" id="err"></div>
    <div class="total"><span>Total</span><span id="tot">KES 0</span></div>
    <button class="pay" id="payBtn" disabled>Pay with M-Pesa</button>
  </aside>

  <!-- POPUPS -->
  <div class="modal" id="modal"><div class="box" id="box"></div></div>
  <div class="modal" id="zoom"><div class="box zoombox"><img id="zoomImg" alt=""><p id="zoomCap"></p><small>Tap anywhere to close</small></div></div>
  <div class="toast" id="toast" role="status"></div>

  <script src="js/products.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
